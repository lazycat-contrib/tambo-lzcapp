version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains: []
  run_buildscript: false

images:
  # Both services are published under the same release version.
  - id: web
    target: service
    service: web
    source: ghcr.io/tambo-ai/tambo-web-server
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

  - id: api
    target: service
    service: api
    source: ghcr.io/tambo-ai/tambo-api-server
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

  - id: postgres
    target: service
    service: postgres
    source: docker.io/library/postgres
    channel: stable
    sort: semver
    tag_regex: '^17(\.[0-9]+)?(-alpine)?$'
    delivery:
      mode: mirror

  - id: minio
    target: service
    service: minio
    source: docker.io/minio/minio
    channel: stable
    sort: semver
    tag_regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$'
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Tambo
    summary: "自托管的生成式 UI 平台，让 AI 智能体为你的 React 应用挑选并流式渲染组件"