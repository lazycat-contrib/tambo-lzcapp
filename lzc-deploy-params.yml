params:
  - id: resend_api_key
    type: secret
    name: "Resend API Key"
    description: "Resend API key used to send email login links (required to sign in)"
    default_value: ""
    optional: false

  - id: email_from
    type: string
    name: "Sender Address"
    description: "Address that login emails are sent from, e.g. tambo@your-domain.com (must be a domain verified in Resend)"
    default_value: ""
    optional: false

  - id: fallback_openai_api_key
    type: secret
    name: "Model API Key"
    description: "OpenAI-compatible API key for the default model (DeepSeek, OpenAI, Ollama and other providers supported)"
    default_value: ""
    optional: true

  - id: allowed_login_domain
    type: string
    name: "Allowed Email Domain (optional)"
    description: "Restrict signups to one email domain, e.g. example.com. Leave empty to allow any domain."
    default_value: ""
    optional: true

  - id: org_name
    type: string
    name: "Organization Name (optional)"
    description: "Organization name displayed in the dashboard"
    default_value: ""
    optional: true

  - id: s3_endpoint
    type: string
    name: "S3 Endpoint (optional)"
    description: "S3-compatible endpoint for attachment uploads, e.g. https://s3.example.com. Leave empty to use the bundled MinIO."
    default_value: ""
    optional: true

  - id: s3_region
    type: string
    name: "S3 Region (optional)"
    description: "Region of your S3 service. Leave empty for the bundled MinIO."
    default_value: ""
    optional: true

  - id: s3_access_key_id
    type: string
    name: "S3 Access Key ID (optional)"
    description: "Access key of your S3 service. Leave empty to use the bundled MinIO."
    default_value: ""
    optional: true

  - id: s3_secret_access_key
    type: secret
    name: "S3 Secret Access Key (optional)"
    description: "Secret key of your S3 service. Leave empty to use the bundled MinIO."
    default_value: ""
    optional: true

  - id: s3_bucket
    type: string
    name: "S3 Bucket (optional)"
    description: "Bucket name for attachment uploads. Leave empty to use the bundled MinIO."
    default_value: ""
    optional: true

